
name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto Android
        run: unzip -o alves-construcoes-android-main-corrigido.zip -d projeto
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Gerar APK
        run: |
          PROJETO=$(find projeto -name settings.gradle.kts -printf '%h\n' | head -n 1)
          echo "Projeto encontrado em: $PROJETO"
          test -n "$PROJETO"
          cd "$PROJETO"
          gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Alves-Construcoes-Gestao-APK
          path: projeto/**/app/build/outputs/apk/debug/app-debug.apk
